
name: Cập nhật kết quả xổ số

on:
  schedule:
    # 16:45 giờ Việt Nam - XSMN
    - cron: '45 9 * * *'

    # 22:15 giờ Việt Nam - Vietlott
    - cron: '15 15 * * *'

  workflow_dispatch:
    inputs:
      kind:
        description: 'Loại kết quả cần cập nhật'
        required: true
        type: choice
        options:
          - all
          - xsmn
          - vietlott
          - mega645
          - power655
          - max3d
          - max3d_pro
          - keno

permissions:
  contents: write

concurrency:
  group: lottery-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Cập nhật dữ liệu xổ số
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kiểm tra môi trường
        run: |
          node --version
          npm --version
          node --check scripts/update.mjs

      - name: Xác định loại cập nhật
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            KIND="$INPUT_KIND"
          else
            case "$SCHEDULE" in
              "45 9 * * *")
                KIND="xsmn"
                ;;
              "15 15 * * *")
                KIND="vietlott"
                ;;
              *)
                echo "::error::Không xác định được lịch chạy: $SCHEDULE"
                exit 1
                ;;
            esac
          fi

          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Bắt đầu cập nhật: $KIND"

      - name: Khởi tạo thư mục dữ liệu
        run: |
          mkdir -p data

          if [ ! -f data/results.json ]; then
            echo '{"updatedAt":null,"xsmn":{},"vietlott":{}}' > data/results.json
          fi

      - name: Cập nhật kết quả
        run: node scripts/update.mjs "${{ steps.target.outputs.kind }}"

      - name: Validate results.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const file = 'data/results.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!data.xsmn || !data.vietlott) {
            throw new Error('Thiếu cấu trúc dữ liệu xổ số');
          }

          if (!data.updatedAt) {
            throw new Error('Thiếu updatedAt');
          }

          console.log('JSON hợp lệ');
          console.log('Updated:', data.updatedAt);
          console.log('XSMN:', Object.keys(data.xsmn).length);
          console.log('Vietlott:', Object.keys(data.vietlott).length);
          NODE

      - name: Commit và push kết quả
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json

          if git diff --cached --quiet; then
            echo "Không có dữ liệu thay đổi."
            exit 0
          fi

          git commit -m "chore: update lottery results (${{ steps.target.outputs.kind }})"

          git push origin "HEAD:${GITHUB_REF_NAME}"
