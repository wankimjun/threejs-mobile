
name: Cập nhật kết quả

on:
  schedule:
    # 16:45 giờ Việt Nam - XSMN
    - cron: '45 9 * * *'

    # 22:00 giờ Việt Nam - Mega 6/45 và Power 6/55
    - cron: '0 15 * * *'

    # 13:30 giờ Việt Nam - Lotto 5/35 kỳ 13:00
    - cron: '30 6 * * *'

    # 21:30 giờ Việt Nam - Lotto 5/35 kỳ 21:00
    - cron: '30 14 * * *'

  workflow_dispatch:
    inputs:
      kind:
        description: 'Loại kết quả cần cập nhật'
        required: true
        type: choice
        options:
          - xsmn
          - vietlott
          - lotto535

permissions:
  contents: write

concurrency:
  group: lottery-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Cập nhật kết quả xổ số
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Xác định loại cập nhật
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            KIND="$INPUT_KIND"
          else
            case "$SCHEDULE" in
              "45 9 * * *")
                KIND="xsmn"
                ;;
              "0 15 * * *")
                KIND="vietlott"
                ;;
              "30 6 * * *"|"30 14 * * *")
                KIND="lotto535"
                ;;
              *)
                echo "::error::Không xác định được lịch chạy: $SCHEDULE"
                exit 1
                ;;
            esac
          fi

          case "$KIND" in
            xsmn|vietlott|lotto535)
              ;;
            *)
              echo "::error::Loại cập nhật không hợp lệ: $KIND"
              exit 1
              ;;
          esac

          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Bắt đầu cập nhật: $KIND"

      - name: Kiểm tra cấu trúc dữ liệu
        run: |
          test -f scripts/update.mjs || {
            echo "::error::Không tìm thấy scripts/update.mjs"
            exit 1
          }

          node --check scripts/update.mjs

          mkdir -p data
          test -f data/results.json || \
            echo '{"updatedAt":null,"xsmn":{},"vietlott":{}}' > data/results.json

      - name: Cập nhật XSMN
        if: steps.target.outputs.kind == 'xsmn'
        run: node scripts/update.mjs xsmn

      - name: Cập nhật Vietlott
        if: steps.target.outputs.kind == 'vietlott'
        run: node scripts/update.mjs vietlott

      - name: Cập nhật Lotto 5/35
        if: steps.target.outputs.kind == 'lotto535'
        run: node scripts/update.mjs lotto535

      - name: Validate results.json
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';

            const file = 'data/results.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));

            if (!data.xsmn || !data.vietlott) {
              throw new Error('Thiếu cấu trúc dữ liệu xổ số');
            }

            if (!data.updatedAt) {
              throw new Error('Thiếu updatedAt');
            }

            console.log('JSON hợp lệ');
            console.log('Updated:', data.updatedAt);
          "

      - name: Commit và push kết quả
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json

          if git diff --cached --quiet; then
            echo "Không có dữ liệu thay đổi."
            exit 0
          fi

          git commit -m "chore: update lottery results (${{ steps.target.outputs.kind }})"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Đã cập nhật kết quả thành công."
