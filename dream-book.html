    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #06050e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f4f1ea;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        /* Tiêu đề góc trên trái */
        .hud-top {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-top h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #f6c959;
            text-shadow: 0 0 16px rgba(246, 201, 89, 0.45);
        }

        .hud-top p {
            font-size: 12.5px;
            color: rgba(244, 241, 234, 0.7);
            margin-top: 4px;
        }

        /* Bảng tra cứu bên trái */
        .search-panel {
            position: fixed;
            top: 84px;
            left: 24px;
            width: 340px;
            max-width: calc(100vw - 48px);
            max-height: calc(100vh - 180px);
            display: flex;
            flex-direction: column;
            background: rgba(15, 13, 28, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(246, 201, 89, 0.25);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
            z-index: 10;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 10px;
            padding: 10px 34px 10px 12px;
            color: #ffffff;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: #f6c959;
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .clear-btn:hover {
            color: #ffffff;
        }

        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag {
            font-size: 11.5px;
            padding: 4px 9px;
            border-radius: 999px;
            background: rgba(246, 201, 89, 0.12);
            border: 1px solid rgba(246, 201, 89, 0.3);
            color: #f6c959;
            cursor: pointer;
            transition: all 0.18s;
        }

        .tag:hover {
            background: #f6c959;
            color: #0d0b18;
        }

        .result-count {
            font-size: 11.5px;
            color: rgba(244, 241, 234, 0.55);
            margin-bottom: 8px;
        }

        .dream-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .dream-list::-webkit-scrollbar {
            width: 5px;
        }

        .dream-list::-webkit-scrollbar-thumb {
            background: rgba(246, 201, 89, 0.3);
            border-radius: 999px;
        }

        .dream-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 11px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.18s;
        }

        .dream-item:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        .dream-item.active {
            background: rgba(246, 201, 89, 0.16);
            border-color: rgba(246, 201, 89, 0.55);
        }

        .dream-label {
            font-size: 13px;
            text-transform: capitalize;
            color: #f4f1ea;
        }

        .dream-nums {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .num-pill {
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(92, 225, 230, 0.16);
            color: #5ce1e6;
        }

        .dream-item.active .num-pill {
            background: #f6c959;
            color: #0d0b18;
        }

        /* Thẻ giải mã bên phải */
        .detail-card {
            position: fixed;
            top: 20px;
            right: 24px;
            width: 310px;
            max-width: calc(100vw - 48px);
            background: rgba(15, 13, 28, 0.84);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(92, 225, 230, 0.3);
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
            z-index: 10;
        }

        .detail-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #5ce1e6;
            margin-bottom: 6px;
        }

        .detail-title {
            font-size: 20px;
            font-weight: 700;
            text-transform: capitalize;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .detail-balls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .ball-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            background: radial-gradient(circle at 30% 30%, #ffe699, #d4941a);
            color: #120e1c;
            box-shadow: 0 0 14px rgba(246, 201, 89, 0.5);
        }

        .detail-note {
            font-size: 11.5px;
            line-height: 1.45;
            color: rgba(244, 241, 234, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        /* Thanh điều khiển bên dưới */
        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgba(15, 13, 28, 0.84);
            backdrop-filter: blur(12px);
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            z-index: 10;
        }

        .control-bar button {
            background: rgba(255, 255, 255, 0.06);
            color: #f4f1ea;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-bar button:hover {
            background: rgba(246, 201, 89, 0.2);
            border-color: #f6c959;
        }

        .control-bar button.primary {
            background: #f6c959;
            color: #0d0b18;
            border-color: #f6c959;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .search-panel {
                top: auto;
                bottom: 72px;
                left: 16px;
                width: calc(100vw - 32px);
                max-height: 220px;
            }

            .detail-card {
                top: 72px;
                right: 16px;
                width: calc(100vw - 32px);
                padding: 12px 16px;
            }
        }
    </style>

`.trim();
        function normalizeText(str) {
            return str
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .trim();
        }
        const DREAM_BOOK = RAW_DREAM_DATA.split('\n').map((line, index) => {
            const [label, numsStr] = line.split('|');
            const numbers = numsStr.split(',').map((n) => Number(n));
            return {
                id: index,
                label: label.trim(),
                normalized: normalizeText(label),
                numbers
            };
        });
        function pad2(n) {
            return String(n).padStart(2, '0');
        }
        // 1. Khởi tạo Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x06050e, 0.007);
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        // 2. Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);
        const light1 = new THREE.PointLight(0xf6c959, 2.5, 160);
        light1.position.set(25, 30, 25);
        scene.add(light1);
        const light2 = new THREE.PointLight(0x5ce1e6, 2.2, 160);
        light2.position.set(-25, -25, -25);
        scene.add(light2);
        // 3. Dựng Khối Cầu Tinh Vân 100 Con Số (00 - 99)
        const sphereGroup = new THREE.Group();
        scene.add(sphereGroup);
        const SPHERE_RADIUS = 23;
        const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
        const numberNodes = [];
        function createNumberTexture(numStr, isHighlighted) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(64, 64, 58, 0, Math.PI * 2);
            ctx.fillStyle = isHighlighted ? '#f6c959' : 'rgba(20, 18, 38, 0.88)';
            ctx.fill();
            ctx.lineWidth = isHighlighted ? 8 : 4;
            ctx.strokeStyle = isHighlighted ? '#ffffff' : 'rgba(92, 225, 230, 0.5)';
            ctx.stroke();
            ctx.fillStyle = isHighlighted ? '#0d0b18' : '#7ee8fa';
            ctx.font = 'bold 52px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(numStr, 64, 68);
            return new THREE.CanvasTexture(canvas);
        }
        const normalTextures = [];
        const activeTextures = [];
        for (let i = 0; i < 100; i++) {
            const s = pad2(i);
            normalTextures.push(createNumberTexture(s, false));
            activeTextures.push(createNumberTexture(s, true));
        }
        for (let i = 0; i < 100; i++) {
            // Phân bố Fibonacci Sphere đều 100 hạt trên bề mặt cầu
            const phi = Math.acos(1 - (2 * (i + 0.5)) / 100);
            const theta = i * GOLDEN_ANGLE;
            const x = SPHERE_RADIUS * Math.sin(phi) * Math.cos(theta);
            const y = SPHERE_RADIUS * Math.cos(phi);
            const z = SPHERE_RADIUS * Math.sin(phi) * Math.sin(theta);
            const spriteMat = new THREE.SpriteMaterial({ map: normalTextures[i], transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(x, y, z);
            sprite.scale.set(2.8, 2.8, 1);
            sphereGroup.add(sprite);
            numberNodes.push({
                number: i,
                sprite,
                basePos: new THREE.Vector3(x, y, z),
                active: false
            });
        }
        // Vòng quỹ đạo trang trí quanh khối cầu
        const ringGeo1 = new THREE.TorusGeometry(SPHERE_RADIUS + 4, 0.1, 16, 128);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0xf6c959, transparent: true, opacity: 0.25 });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 2.4;
        sphereGroup.add(ring1);
        const ringGeo2 = new THREE.TorusGeometry(SPHERE_RADIUS + 6.5, 0.08, 16, 128);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x5ce1e6, transparent: true, opacity: 0.2 });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.y = Math.PI / 3;
        sphereGroup.add(ring2);
        // Đường nối năng lượng giữa các số trúng của giấc mơ
        let connectionLines = null;
        function updateConnections(activeNumbers) {
            if (connectionLines) {
                sphereGroup.remove(connectionLines);
                connectionLines.geometry.dispose();
                connectionLines.material.dispose();
                connectionLines = null;
            }
            if (activeNumbers.length < 2) return;
            const points = [];
            for (let i = 0; i < activeNumbers.length; i++) {
                for (let j = i + 1; j < activeNumbers.length; j++) {
                    const p1 = numberNodes[activeNumbers[i]].basePos;
                    const p2 = numberNodes[activeNumbers[j]].basePos;
                    points.push(p1, p2);
                }
            }
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({
                color: 0xf6c959,
                transparent: true,
                opacity: 0.85
            });
            connectionLines = new THREE.LineSegments(lineGeo, lineMat);
            sphereGroup.add(connectionLines);
        }
        // Bầu trời sao nền
        const starGeo = new THREE.BufferGeometry();
        const starCount = 1500;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 280;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
        // 4. Quản lý Giao diện & Tra cứu
        const searchInput = document.getElementById('search-input');
        const clearBtn = document.getElementById('clear-btn');
        const resultCount = document.getElementById('result-count');
        const dreamListEl = document.getElementById('dream-list');
        const detailBadge = document.getElementById('detail-badge');
        const detailTitle = document.getElementById('detail-title');
        const detailBalls = document.getElementById('detail-balls');
        let filteredDreams = [...DREAM_BOOK];
        let currentDream = DREAM_BOOK.find((d) => d.label === 'con rồng') || DREAM_BOOK[0];
        function selectDream(entry) {
            currentDream = entry;
            detailBadge.textContent = `Mục #${entry.id + 1} / ${DREAM_BOOK.length}`;
            detailTitle.textContent = entry.label;
            detailBalls.innerHTML = entry.numbers
                .map((n) => `<div class="ball-badge">${pad2(n)}</div>`)
                .join('');
            // Cập nhật trạng thái nổi bật trên danh sách
            document.querySelectorAll('.dream-item').forEach((el) => {
                el.classList.toggle('active', Number(el.dataset.id) === entry.id);
            });
            // Cập nhật 100 quả cầu số trong không gian 3D
            const activeSet = new Set(entry.numbers);
            numberNodes.forEach((node) => {
                const isHit = activeSet.has(node.number);
                if (node.active !== isHit) {
                    node.active = isHit;
                    node.sprite.material.map = isHit ? activeTextures[node.number] : normalTextures[node.number];
                    node.sprite.material.needsUpdate = true;
                }
            });
            updateConnections(entry.numbers);
        }
        function renderDreamList(list) {
            resultCount.textContent = `Tìm thấy ${list.length} / ${DREAM_BOOK.length} giấc mơ`;
            const visibleItems = list.slice(0, 120); // Giới hạn 120 mục hiển thị DOM để mượt mà
            dreamListEl.innerHTML = visibleItems
                .map(
                    (item) => `<div class="dream-item ${item.id === currentDream.id ? 'active' : ''}" data-id="${item.id}"> <span class="dream-label">${item.label}</span> <div class="dream-nums"> ${item.numbers.map((n) => `${pad2(n)}`).join('')} </div> </div> `
                )
                .join('');
            dreamListEl.querySelectorAll('.dream-item').forEach((el) => {
                el.addEventListener('click', () => {
                    const found = DREAM_BOOK[Number(el.dataset.id)];
                    if (found) selectDream(found);
                });
            });
        }
        function filterDreams(query) {
            const q = normalizeText(query);
            if (!q) {
                filteredDreams = [...DREAM_BOOK];
            } else {
                filteredDreams = DREAM_BOOK.filter(
                    (d) => d.normalized.includes(q) || d.numbers.some((n) => pad2(n).includes(q))
                );
            }
            renderDreamList(filteredDreams);
            if (filteredDreams.length > 0 && !filteredDreams.some((d) => d.id === currentDream.id)) {
                selectDream(filteredDreams[0]);
            }
        }
        searchInput.addEventListener('input', (e) => filterDreams(e.target.value));
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            filterDreams('');
            searchInput.focus();
        });
        document.querySelectorAll('.tag').forEach((tag) => {
            tag.addEventListener('click', () => {
                searchInput.value = tag.dataset.q;
                filterDreams(tag.dataset.q);
            });
        });
        // Nút điều hướng Dưới cùng
        document.getElementById('btn-random').addEventListener('click', () => {
            const rand = DREAM_BOOK[Math.floor(Math.random() * DREAM_BOOK.length)];
            selectDream(rand);
            const activeEl = dreamListEl.querySelector('.dream-item[data-id="${rand.id}"]');
            if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        });
        document.getElementById('btn-prev').addEventListener('click', () => {
            const prevIdx = (currentDream.id - 1 + DREAM_BOOK.length) % DREAM_BOOK.length;
            selectDream(DREAM_BOOK[prevIdx]);
        });
        document.getElementById('btn-next').addEventListener('click', () => {
            const nextIdx = (currentDream.id + 1) % DREAM_BOOK.length;
            selectDream(DREAM_BOOK[nextIdx]);
        });
        // Khởi tạo dữ liệu ban đầu
        renderDreamList(DREAM_BOOK);
        selectDream(currentDream);
        // 5. Điều khiển Camera chuột & zoom
        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let targetRotY = 0.4;
        let targetRotX = 0.25;
        let currentRotY = 0.4;
        let currentRotX = 0.25;
        let targetZoom = 66;
        let currentZoom = 66;
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevX = e.clientX;
            prevY = e.clientY;
        });
        window.addEventListener('mouseup', () => {
            isDragging = false;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - prevX;
            const dy = e.clientY - prevY;
            prevX = e.clientX;
            prevY = e.clientY;
            targetRotY -= dx * 0.006;
            targetRotX += dy * 0.006;
            targetRotX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, targetRotX));
        });
        container.addEventListener(
            'wheel',
            (e) => {
                e.preventDefault();
                targetZoom += e.deltaY * 0.04;
                targetZoom = Math.max(30, Math.min(130, targetZoom));
            },
            { passive: false }
        );
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        // 6. Vòng lặp Animation
        let animTime = 0;
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = (now - lastTime) * 0.001;
            lastTime = now;
            animTime += dt;
            if (!isDragging) {
                targetRotY += dt * 0.16;
            }
            // Hiệu ứng nhịp thở cho các quả cầu số được chọn
            numberNodes.forEach((node) => {
                if (node.active) {
                    const s = 4.6 + Math.sin(animTime * 5) * 0.45;
                    node.sprite.scale.set(s, s, 1);
                } else {
                    node.sprite.scale.set(2.5, 2.5, 1);
                }
            });
            ring1.rotation.z = animTime * 0.15;
            ring2.rotation.x = animTime * 0.12;
            currentRotX += (targetRotX - currentRotX) * 0.08;
            currentRotY += (targetRotY - currentRotY) * 0.08;
            currentZoom += (targetZoom - currentZoom) * 0.08;
            camera.position.x = currentZoom * Math.sin(currentRotY) * Math.cos(currentRotX);
            camera.position.y = currentZoom * Math.sin(currentRotX);
            camera.position.z = currentZoom * Math.cos(currentRotY) * Math.cos(currentRotX);
            camera.lookAt(0, 0, 0);
            stars.rotation.y = animTime * 0.015;
            renderer.render(scene, camera);
        }
        animate(performance.now());
    </script>
