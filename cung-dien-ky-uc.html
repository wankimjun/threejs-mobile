<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cung điện ký ức</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060f;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8e4f5; font-size: 15px; }
  canvas { position: fixed; inset: 0; display: block; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid #cbb8ff; outline-offset: 2px;
  }
  [hidden] { display: none !important; }

  .panel {
    position: fixed; background: rgba(15, 12, 30, .84); border: 1px solid rgba(180, 160, 255, .22);
    border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2;
  }

  /* ---------- Nút ---------- */
  .btn {
    background: rgba(120, 100, 200, .2); border: 1px solid rgba(180, 160, 255, .3); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: rgba(140, 120, 230, .35); border-color: rgba(203, 184, 255, .6); }
  .btn.primary {
    background: linear-gradient(135deg, #b89cff, #ff9ecf); border: 0; color: #15101f; font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.07); background: linear-gradient(135deg, #b89cff, #ff9ecf); }
  .btn.danger { background: #e0476a; border: 0; color: #fff; font-weight: 600; }
  .btn.danger:hover { background: #f05a7c; }
  .btn.quiet { background: transparent; border-color: rgba(180, 160, 255, .2); }
  .icon-btn {
    background: transparent; border: 0; width: 34px; height: 34px; border-radius: 50%;
    font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center; color: #cbb8ff;
  }
  .icon-btn:hover { background: rgba(180, 160, 255, .15); }

  /* ---------- Bảng trái: danh sách ---------- */
  #ui { top: 16px; left: 16px; width: 300px; max-height: calc(100% - 32px); display: flex; flex-direction: column; }
  .head { padding: 16px 16px 12px; border-bottom: 1px solid rgba(180, 160, 255, .15); }
  h1 { font-size: 19px; margin: 0; font-weight: 600; color: #f3e8ff; }
  .sub { font-size: 13px; color: #a9a2c4; margin: 4px 0 0; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px 0; }

  #form { margin: 12px 16px 0; padding: 12px; background: rgba(8, 6, 20, .55); border-radius: 12px;
    display: flex; flex-direction: column; gap: 8px; }
  #form h2 { font-size: 14px; margin: 0; color: #cbb8ff; font-weight: 600; }
  label.fl { font-size: 12px; color: #a9a2c4; display: flex; flex-direction: column; gap: 4px; }
  input, textarea, select {
    background: rgba(8, 6, 20, .8); border: 1px solid rgba(180, 160, 255, .25); border-radius: 9px;
    padding: 8px 10px; width: 100%; outline: none; color: #f3e8ff;
  }
  input:focus, textarea:focus, select:focus { border-color: #cbb8ff; }
  input.invalid { border-color: #ff6b8a; }
  textarea { resize: vertical; min-height: 64px; }
  .err { font-size: 12px; color: #ff8fa6; min-height: 0; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }

  #list { flex: 1; overflow-y: auto; padding: 10px 8px 6px; margin-top: 6px; min-height: 80px; }
  .room { margin-bottom: 6px; }
  .room-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: transparent; border: 0; border-radius: 9px; padding: 8px 10px; cursor: pointer;
    font-weight: 600; color: #ffd9a8; text-align: left;
  }
  .room-btn:hover { background: rgba(180, 160, 255, .1); }
  .room-btn.current { background: rgba(180, 160, 255, .16); }
  .count { font-size: 12px; font-weight: 500; color: #a9a2c4; background: rgba(8, 6, 20, .6);
    border-radius: 999px; padding: 1px 8px; }
  .mem-btn {
    display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px;
    padding: 7px 10px 7px 22px; cursor: pointer; color: #d8d2ea; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mem-btn:hover { background: rgba(180, 160, 255, .08); }
  .mem-btn.on { background: rgba(180, 160, 255, .22); color: #fff; box-shadow: inset 3px 0 0 #ffb36b; }
  .empty { font-size: 13px; color: #8c86a6; padding: 6px 22px; font-style: italic; }

  .hint { font-size: 12px; color: #8c86a6; padding: 10px 16px 14px; border-top: 1px solid rgba(180, 160, 255, .12); }

  /* ---------- Bảng phải: chi tiết ---------- */
  #detail {
    top: 16px; right: 16px; width: 320px; padding: 18px; transition: opacity .25s, transform .25s;
  }
  #detail.hidden { opacity: 0; transform: translateX(16px); pointer-events: none; }
  .d-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .room-tag { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .9px; color: #ffd9a8; }
  #dTitle { font-size: 21px; margin: 8px 0 10px; color: #f3e8ff; font-weight: 600; line-height: 1.3; }
  #dText { font-size: 15px; line-height: 1.65; color: #d8d2ea; white-space: pre-wrap; margin: 0; }
  #dText.empty { color: #8c86a6; font-style: italic; }
  .d-nav { display: flex; gap: 8px; margin-top: 16px; }
  .d-nav .btn { flex: 1; }
  .danger-zone { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255, 110, 140, .18); }
  .danger-zone .btn.quiet { color: #ff8fa6; border-color: rgba(255, 110, 140, .3); }
  .danger-zone .btn.quiet:hover { background: rgba(255, 90, 120, .12); border-color: rgba(255, 110, 140, .55); }
  #dConfirm { display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #ffc2cf; }
  #dConfirm .row { justify-content: stretch; }
  #dConfirm .row .btn { flex: 1; }

  /* ---------- Thông báo ---------- */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 12px); opacity: 0;
    background: rgba(15, 12, 30, .92); border: 1px solid rgba(180, 160, 255, .35); border-radius: 999px;
    padding: 9px 18px; font-size: 14px; z-index: 5; pointer-events: none; transition: opacity .25s, transform .25s;
    white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Di động ---------- */
  @media (max-width: 640px) {
    #ui { top: 10px; left: 10px; right: 10px; width: auto; max-height: 44vh; }
    .hint { display: none; }
    .head { padding: 12px 14px 10px; }
    h1 { font-size: 17px; }
    .sub { display: none; }
    .actions { padding: 10px 12px 0; }
    #form { margin: 10px 12px 0; }
    #list { padding: 6px 6px 4px; }
    #detail { top: auto; left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 52vh; overflow-y: auto;
      padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    #detail.hidden { transform: translateY(16px); }
    .btn { min-height: 40px; }
    #toast { bottom: auto; top: 12px; }
  }
</style>
</head>
<body>

<!-- Bảng danh sách và thêm ký ức -->
<aside id="ui" class="panel" aria-label="Danh sách ký ức">
  <div class="head">
    <h1>Cung điện ký ức</h1>
    <p class="sub">Mỗi viên pha lê là một ký ức.</p>
  </div>

  <div class="actions">
    <button type="button" class="btn primary" id="addBtn" aria-expanded="false" aria-controls="form">+ Thêm ký ức</button>
    <button type="button" class="btn quiet" id="resetBtn" title="Quay về góc nhìn tổng quan">Tổng quan</button>
  </div>

  <form id="form" hidden novalidate>
    <h2>Thêm ký ức mới</h2>
    <label class="fl">Tiêu đề
      <input id="fTitle" maxlength="40" placeholder="Ví dụ: Buổi sáng ở biển">
    </label>
    <div class="err" id="fErr" role="alert"></div>
    <label class="fl">Nội dung
      <textarea id="fText" rows="3" placeholder="Viết vài dòng về ký ức này (không bắt buộc)"></textarea>
    </label>
    <label class="fl">Phòng
      <select id="fRoom"></select>
    </label>
    <div class="row">
      <button type="button" class="btn quiet" id="cancelBtn">Hủy</button>
      <button type="submit" class="btn primary">Thêm ký ức</button>
    </div>
  </form>

  <nav id="list" aria-label="Các phòng và ký ức"></nav>

  <div class="hint">Kéo để xoay · Cuộn để phóng to · Chạm viên pha lê để xem</div>
</aside>

<!-- Chi tiết ký ức -->
<aside id="detail" class="panel hidden" role="dialog" aria-labelledby="dTitle" aria-live="polite">
  <div class="d-top">
    <span id="dRoom" class="room-tag"></span>
    <button type="button" id="closeDetail" class="icon-btn" aria-label="Đóng chi tiết">×</button>
  </div>
  <h2 id="dTitle"></h2>
  <p id="dText"></p>
  <div class="d-nav">
    <button type="button" class="btn" id="prevBtn">‹ Trước</button>
    <button type="button" class="btn" id="nextBtn">Sau ›</button>
  </div>

  <div class="danger-zone">
    <button type="button" class="btn quiet" id="dDelete">Xóa ký ức</button>
    <div id="dConfirm" hidden>
      <span>Xóa ký ức này? Hành động không thể hoàn tác.</span>
      <div class="row">
        <button type="button" class="btn" id="dKeep">Giữ lại</button>
        <button type="button" class="btn danger" id="dYes">Xóa</button>
      </div>
    </div>
  </div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);

// ---------- Dữ liệu ----------
const ROOMS = [
  { name: 'Tuổi thơ',  color: 0xffb36b },
  { name: 'Tình bạn',  color: 0x6bd6ff },
  { name: 'Chuyến đi', color: 0x9d7bff },
  { name: 'Gia đình',  color: 0xff6b9d },
  { name: 'Tương lai', color: 0x7dffb0 },
];
const RING_R = 26;
const roomPos = i => {
  const a = (i / ROOMS.length) * Math.PI * 2;
  return new THREE.Vector3(Math.cos(a) * RING_R, 0, Math.sin(a) * RING_R);
};

const DEFAULTS = [
  { title: 'Mùa hè ở quê ngoại', text: 'Tiếng ve râm ran, mùi bưởi chín và những buổi chiều đuổi nhau dưới bờ ao.', room: 0 },
  { title: 'Chiếc xe đạp đầu tiên', text: 'Ba giữ yên sau, tôi loạng choạng rồi bỗng thấy mình tự đạp được.', room: 0 },
  { title: 'Người bạn cùng bàn', text: 'Chúng tôi chia nhau từng viên kẹo trong giờ học thuộc lòng.', room: 1 },
  { title: 'Đêm ở Đà Lạt', text: 'Sương phủ kín con dốc, hai đứa co ro uống trà gừng bên bếp lửa.', room: 2 },
  { title: 'Bữa cơm chiều', text: 'Mẹ luôn gắp miếng cá ngon nhất cho người đi xa mới về.', room: 3 },
  { title: 'Lời hứa với chính mình', text: 'Một ngày nào đó sẽ viết xong cuốn sách còn dang dở.', room: 4 },
];

const KEY = 'memory-palace-v1';
let memories;
try { memories = JSON.parse(localStorage.getItem(KEY)); } catch (e) { memories = null; }
if (!Array.isArray(memories)) memories = DEFAULTS.map((m, i) => ({ ...m, id: 'd' + i }));
function save() { try { localStorage.setItem(KEY, JSON.stringify(memories)); } catch (e) {} }

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060f);
scene.fog = new THREE.FogExp2(0x07060f, 0.008);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);
const HOME_POS = new THREE.Vector3(0, 18, 48);
const HOME_TGT = new THREE.Vector3(0, 4, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.AmbientLight(0x6a6a9a, 0.8));
const sun = new THREE.DirectionalLight(0xddd0ff, 0.6);
sun.position.set(20, 40, 20);
scene.add(sun);

// Trung tâm: pha lê lớn và bệ đá
const hubBase = new THREE.Mesh(
  new THREE.CylinderGeometry(3.5, 4, 1.2, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a2350, roughness: 0.5 })
);
hubBase.position.y = 0.6;
scene.add(hubBase);

const hub = new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.4, 1),
  new THREE.MeshStandardMaterial({ color: 0xc8b6ff, emissive: 0x6a4dff, emissiveIntensity: 0.8, roughness: 0.2 })
);
hub.position.y = 9;
scene.add(hub);

// Các sợi nối từ trung tâm tới mỗi phòng
const linkMat = new THREE.LineBasicMaterial({ color: 0x9d8cff, transparent: true, opacity: 0.25 });
ROOMS.forEach((_, i) => {
  const p = roomPos(i);
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(p.x, 0.3, p.z)]);
  scene.add(new THREE.Line(geo, linkMat));
});

// Canvas text -> sprite nhãn
function makeLabel(text, color, scale) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  const t = text.length > 22 ? text.slice(0, 21) + '…' : text;
  x.font = '600 52px system-ui, sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.shadowColor = 'rgba(0,0,0,0.8)';
  x.shadowBlur = 10;
  x.fillStyle = '#' + new THREE.Color(color).getHexString();
  x.fillText(t, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(4 * scale, scale, 1);
  return s;
}

// ---------- Các phòng (cố định) ----------
ROOMS.forEach((r, i) => {
  const p = roomPos(i);
  const g = new THREE.Group();
  g.position.copy(p);

  const floor = new THREE.Mesh(
    new THREE.CylinderGeometry(9, 9.5, 0.8, 64),
    new THREE.MeshStandardMaterial({ color: 0x1d1838, roughness: 0.6, metalness: 0.3 })
  );
  floor.position.y = -0.4;
  g.add(floor);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(9.2, 0.08, 8, 96),
    new THREE.MeshBasicMaterial({ color: r.color })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.05;
  g.add(ring);

  for (let k = 0; k < 8; k++) {
    const a = (k / 8) * Math.PI * 2;
    const px = Math.cos(a) * 8.5, pz = Math.sin(a) * 8.5;
    const pil = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.6, 7, 12),
      new THREE.MeshStandardMaterial({ color: 0x2a2350, roughness: 0.5 })
    );
    pil.position.set(px, 3.5, pz);
    g.add(pil);
    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshBasicMaterial({ color: r.color }));
    orb.position.set(px, 7.2, pz);
    g.add(orb);
  }

  const label = makeLabel(r.name, r.color, 1.8);
  label.position.set(0, 9, 0);
  g.add(label);

  const light = new THREE.PointLight(r.color, 40, 30);
  light.position.set(0, 4, 0);
  g.add(light);

  scene.add(g);
});

// ---------- Ký ức (pha lê) ----------
const memGroup = new THREE.Group();
scene.add(memGroup);
let crystals = [];
let hoveredCrystal = null;

function disposeGroup(group) {
  group.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
  group.clear();
}

function buildMemories() {
  disposeGroup(memGroup);
  crystals = [];
  hoveredCrystal = null;

  ROOMS.forEach((room, ri) => {
    const list = memories.filter(m => m.room === ri);
    const rp = roomPos(ri);
    const n = list.length;
    const R = 2.5 + n * 0.35;
    const col = room.color;

    list.forEach((m, k) => {
      const a = (k / Math.max(n, 1)) * Math.PI * 2;
      const x = rp.x + Math.cos(a) * R;
      const z = rp.z + Math.sin(a) * R;

      const ped = new THREE.Mesh(
        new THREE.CylinderGeometry(0.6, 0.8, 1.2, 24),
        new THREE.MeshStandardMaterial({ color: 0x2a2350, roughness: 0.5 })
      );
      ped.position.set(x, 0.6, z);

      const crystal = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.7),
        new THREE.MeshStandardMaterial({
          color: col, emissive: col, emissiveIntensity: 0.6,
          roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.92
        })
      );
      crystal.position.set(x, 2.3, z);
      crystal.userData = { memId: m.id, base: 2.3, phase: k + ri };
      crystals.push(crystal);

      const label = makeLabel(m.title, col, 0.6);
      label.position.set(x, 3.8, z);

      memGroup.add(ped, crystal, label);
    });
  });
}

// ---------- Hạt bụi bay ----------
const N = 900;
const pArr = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const r = 40 + Math.random() * 60;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  pArr[i * 3] = r * Math.sin(ph) * Math.cos(th);
  pArr[i * 3 + 1] = r * Math.cos(ph) * 0.5 + 10;
  pArr[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0xcbb8ff, size: 0.25, transparent: true, opacity: 0.7
}));
scene.add(particles);

// ---------- Di chuyển camera ----------
let flyGoal = null;
function flyTo(target, pos) { flyGoal = { target, pos }; }
controls.addEventListener('start', () => { flyGoal = null; });

function focusMemory(m) {
  const c = crystals.find(c => c.userData.memId === m.id);
  if (!c) return;
  const p = c.position.clone();
  flyTo(p, p.clone().add(new THREE.Vector3(0, 2.5, 7)));
}
function focusRoom(i) {
  const rp = roomPos(i);
  const out = rp.clone().normalize().multiplyScalar(14);
  flyTo(rp.clone().add(new THREE.Vector3(0, 2, 0)), rp.clone().add(out).add(new THREE.Vector3(0, 9, 0)));
}
function focusOverview() {
  flyTo(HOME_TGT.clone(), HOME_POS.clone());
}

// ---------- Trạng thái UI ----------
const listEl = $('list');
const form = $('form');
const fTitle = $('fTitle');
const fText = $('fText');
const fRoom = $('fRoom');
const fErr = $('fErr');
const addBtn = $('addBtn');
const detail = $('detail');
const dRoom = $('dRoom');
const dTitle = $('dTitle');
const dText = $('dText');
const dDelete = $('dDelete');
const dConfirm = $('dConfirm');
let selectedId = null;
let currentRoom = 0;

ROOMS.forEach((r, i) => {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = r.name;
  fRoom.appendChild(o);
});

// ---------- Thông báo ----------
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- Form thêm ----------
function openForm() {
  form.hidden = false;
  addBtn.setAttribute('aria-expanded', 'true');
  fRoom.value = currentRoom;
  fTitle.focus();
}
function closeForm() {
  form.hidden = true;
  addBtn.setAttribute('aria-expanded', 'false');
  form.reset();
  fErr.textContent = '';
  fTitle.classList.remove('invalid');
}
addBtn.addEventListener('click', () => (form.hidden ? openForm() : closeForm()));
$('cancelBtn').addEventListener('click', closeForm);

form.addEventListener('submit', e => {
  e.preventDefault();
  const title = fTitle.value.trim();
  if (!title) {
    fErr.textContent = 'Hãy nhập tiêu đề cho ký ức.';
    fTitle.classList.add('invalid');
    fTitle.focus();
    return;
  }
  const room = Number(fRoom.value);
  const m = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title,
    text: fText.value.trim(),
    room
  };
  memories.push(m);
  save();
  closeForm();
  rebuild();
  toast('Đã thêm ký ức vào ' + ROOMS[room].name);
  selectMemory(m);
});
fTitle.addEventListener('input', () => {
  if (fTitle.value.trim()) { fErr.textContent = ''; fTitle.classList.remove('invalid'); }
});

// ---------- Danh sách ----------
function renderList() {
  listEl.innerHTML = '';
  ROOMS.forEach((r, i) => {
    const items = memories.filter(m => m.room === i);
    const wrap = document.createElement('div');
    wrap.className = 'room';

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'room-btn' + (i === currentRoom ? ' current' : '');
    head.style.color = '#' + new THREE.Color(r.color).getHexString();
    head.innerHTML = '';
    const name = document.createElement('span');
    name.textContent = r.name;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = items.length;
    head.append(name, count);
    head.addEventListener('click', () => {
      currentRoom = i;
      focusRoom(i);
      renderList();
    });
    wrap.appendChild(head);

    if (!items.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Chưa có ký ức nào';
      wrap.appendChild(e);
    }
    items.forEach(m => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mem-btn' + (m.id === selectedId ? ' on' : '');
      b.textContent = m.title;
      b.title = m.title;
      b.addEventListener('click', () => selectMemory(m));
      wrap.appendChild(b);
    });
    listEl.appendChild(wrap);
  });
}

// ---------- Chi tiết ----------
function currentList() {
  return memories.filter(m => m.room === currentRoom);
}

function showDetail(m) {
  dRoom.textContent = ROOMS[m.room] ? ROOMS[m.room].name : '';
  dTitle.textContent = m.title;
  dText.textContent = m.text || 'Ký ức này chưa có nội dung.';
  dText.classList.toggle('empty', !m.text);
  resetConfirm();
  detail.classList.remove('hidden');
  const list = currentList();
  const idx = list.findIndex(x => x.id === m.id);
  $('prevBtn').disabled = list.length < 2 || idx <= 0;
  $('nextBtn').disabled = list.length < 2 || idx >= list.length - 1;
}

function selectMemory(m) {
  selectedId = m.id;
  currentRoom = m.room;
  focusMemory(m);
  showDetail(m);
  renderList();
}

function closeDetail() {
  detail.classList.add('hidden');
  selectedId = null;
  resetConfirm();
  renderList();
}

function stepMemory(dir) {
  const list = currentList();
  const idx = list.findIndex(x => x.id === selectedId);
  const next = list[idx + dir];
  if (next) selectMemory(next);
}

$('closeDetail').addEventListener('click', closeDetail);
$('prevBtn').addEventListener('click', () => stepMemory(-1));
$('nextBtn').addEventListener('click', () => stepMemory(1));
$('resetBtn').addEventListener('click', () => {
  selectedId = null;
  detail.classList.add('hidden');
  resetConfirm();
  focusOverview();
  renderList();
});

// ---------- Xóa: tách riêng và có xác nhận ----------
function resetConfirm() {
  dConfirm.hidden = true;
  dDelete.hidden = false;
}
dDelete.addEventListener('click', () => {
  dDelete.hidden = true;
  dConfirm.hidden = false;
  $('dKeep').focus();
});
$('dKeep').addEventListener('click', resetConfirm);
$('dYes').addEventListener('click', () => {
  const m = memories.find(x => x.id === selectedId);
  if (!m) return;
  memories = memories.filter(x => x.id !== m.id);
  save();
  const roomName = ROOMS[m.room].name;
  selectedId = null;
  detail.classList.add('hidden');
  resetConfirm();
  rebuild();
  toast('Đã xóa ký ức khỏi ' + roomName);
});

// ---------- Phím tắt ----------
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!detail.classList.contains('hidden')) closeDetail();
    else if (!form.hidden) closeForm();
  }
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (selectedId && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    stepMemory(e.key === 'ArrowLeft' ? -1 : 1);
  }
});

function rebuild() {
  buildMemories();
  renderList();
}

// ---------- Chọn bằng chuột ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downX = 0, downY = 0;

function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(crystals, false);
  return hits.length ? hits[0].object : null;
}

renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return;
  const hit = pick(e);
  if (hit) {
    const m = memories.find(x => x.id === hit.userData.memId);
    if (m) selectMemory(m);
  }
});
renderer.domElement.addEventListener('pointermove', e => {
  const hit = pick(e);
  hoveredCrystal = hit;
  document.body.style.cursor = hit ? 'pointer' : 'default';
});

// ---------- Vòng lặp ----------
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const scaleTarget = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const c of crystals) {
    const isSel = c.userData.memId === selectedId;
    const isHov = c === hoveredCrystal;
    c.rotation.y += 0.01;
    c.position.y = c.userData.base + Math.sin(t * 1.5 + c.userData.phase) * 0.25;
    // Phản hồi trạng thái: đang chọn > đang trỏ > bình thường
    const s = isSel ? 1.35 : isHov ? 1.15 : 1;
    scaleTarget.set(s, s, s);
    c.scale.lerp(scaleTarget, 0.12);
    c.material.emissiveIntensity = isSel ? 1.2 : isHov ? 0.9 : 0.6;
  }
  hub.rotation.y += 0.004;
  hub.rotation.x += 0.0015;
  particles.rotation.y += 0.0004;

  if (flyGoal) {
    controls.target.lerp(flyGoal.target, 0.06);
    camera.position.lerp(flyGoal.pos, 0.06);
    if (controls.target.distanceTo(flyGoal.target) < 0.05 && camera.position.distanceTo(flyGoal.pos) < 0.05) {
      flyGoal = null;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

buildMemories();
renderList();
animate();
</script>
