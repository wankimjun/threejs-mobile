<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1218">
<title>Progression — Upper / Lower</title>
<style>
:root{color-scheme:dark;--bg:#0f1218;--panel:#171d28;--line:#2a3445;--muted:#94a3b8;--text:#e8ecf2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding:clamp(10px,2vw,22px);padding-bottom:env(safe-area-inset-bottom)}
header{max-width:1100px;margin:0 auto 14px}
h1{font-size:clamp(19px,3vw,26px);margin:0 0 5px}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
main{max-width:1100px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
button{background:#202938;color:var(--text);border:1px solid #354258;border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer;touch-action:manipulation}
button.on{background:#2563eb;border-color:#3b82f6}
button:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.chart-scroll{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:8px}
canvas{display:block;width:100%;height:340px;touch-action:pan-y; -webkit-tap-highlight-color:transparent}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
#detail{line-height:1.55;font-size:14px}
#detail:empty{display:none}
.detail-head{font-weight:700;margin-bottom:3px}
.total{font-size:12px;color:var(--muted);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 4px;border-bottom:1px solid #2a3445;vertical-align:top}
td.r{text-align:right;color:#cbd5e1;white-space:nowrap}
.guide{border-top:1px solid #2a3445;padding:9px 0}
.guide summary{font-weight:600;cursor:pointer}
.guide-body{font-size:13px;color:#bdc8d8;padding:7px 2px 0}
.guide-body ol{padding-left:22px}
.guide-body li{margin:4px 0}
.warning{color:#fbbf24}
.guide a{color:#60a5fa}
@media(max-width:600px){
 body{padding:12px 10px calc(14px + env(safe-area-inset-bottom))}
 .panel{padding:10px}
 canvas{height:310px}
 button{padding:10px 12px}
}
</style>
</head>
<body>
<header>
 <h1>Progression — Upper / Lower</h1>
 <p class="sub">Khối lượng tập = sets × reps × hệ số hai bên. Chạm vào cột để xem bài tập và hướng dẫn kỹ thuật. Biểu đồ dùng Canvas 2D, không cần WebGL.</p>
</header>
<main>
 <section class="panel">
  <div class="toolbar" id="weeks" aria-label="Lọc theo tuần"></div>
  <div class="toolbar">
   <button id="reset" type="button">Hiện tất cả</button>
  </div>
  <div class="chart-scroll" id="chartScroll">
   <canvas id="chart" tabindex="0" role="img" aria-label="Biểu đồ khối lượng tập theo tuần và buổi"></canvas>
  </div>
  <p class="hint">Trên điện thoại, vuốt ngang biểu đồ nếu cần. Chạm vào một cột để xem chi tiết.</p>
 </section>
 <section class="panel" id="detail" aria-live="polite">Chọn một cột trong biểu đồ để xem chi tiết.</section>
</main>

// Tuần 1–3: reps tăng 10%/tuần (double progression). Tuần 4: deload, còn 2 hiệp.
function exVol(e, w){
  const [, sets, reps, side] = e;
  const st = w === 3 ? 2 : sets;
  const rp = w < 3 ? reps * (1 + 0.1 * w) : reps;
  return st * rp * side;
}
function volume(s, w){ return SESSIONS[s].ex.reduce((a, e) => a + exVol(e, w), 0); }


const COLORS = SESSIONS.map(x => '#' + x.color.toString(16).padStart(6,'0'));
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const scroll = document.getElementById('chartScroll');
const detail = document.getElementById('detail');
const weekBox = document.getElementById('weeks');
let filter = -1;
let hitAreas = [];
let selected = null;
let cssWidth = 900, cssHeight = 340, dpr = 1;

function setupCanvas(){
 const mobile = window.matchMedia('(max-width:600px)').matches;
 const available = Math.max(300, scroll.clientWidth);
 cssWidth = mobile ? Math.max(760, available) : available;
 cssHeight = mobile ? 310 : 360;
 dpr = Math.min(window.devicePixelRatio || 1, 2);
 canvas.width = Math.round(cssWidth*dpr);
 canvas.height = Math.round(cssHeight*dpr);
 canvas.style.width = cssWidth+'px';
 canvas.style.height = cssHeight+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 drawChart();
}
function roundRect(c,x,y,w,h,r){
 // CanvasRenderingContext2D.roundRect chưa có trên một số phiên bản Safari/iOS cũ.
 c.beginPath();
 if (typeof c.roundRect === 'function') {
  c.roundRect(x,y,w,h,r);
 } else {
  const radius = Math.max(0, Math.min(r, w/2, h/2));
  c.moveTo(x+radius,y);
  c.lineTo(x+w-radius,y);
  c.quadraticCurveTo(x+w,y,x+w,y+radius);
  c.lineTo(x+w,y+h-radius);
  c.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
  c.lineTo(x+radius,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-radius);
  c.lineTo(x,y+radius);
  c.quadraticCurveTo(x,y,x+radius,y);
  c.closePath();
 }
}
function drawChart(){
 if(!ctx) return;
 ctx.clearRect(0,0,cssWidth,cssHeight);
 ctx.fillStyle='#111722';ctx.fillRect(0,0,cssWidth,cssHeight);
 const left=48,right=18,top=24,bottom=48;
 const plotW=cssWidth-left-right,plotH=cssHeight-top-bottom;
 const maxVal=Math.ceil(Math.max(...SESSIONS.flatMap((s,i)=>WEEKS.map((_,w)=>volume(i,w))))/100)*100;
 ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
 for(let n=0;n<=4;n++){
  const y=top+plotH-(plotH*n/4);
  ctx.strokeStyle='#293446';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(cssWidth-right,y);ctx.stroke();
  ctx.fillStyle='#94a3b8';ctx.fillText(String(Math.round(maxVal*n/4)),left-8,y);
 }
 const groupW=plotW/4, barW=Math.min(34,groupW/7), gap=Math.max(5,Math.min(12,groupW/20));
 hitAreas=[];
 for(let w=0;w<4;w++){
  const gx=left+w*groupW;
  ctx.fillStyle='#cbd5e1';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='12px system-ui';ctx.fillText(WEEKS[w],gx+groupW/2,cssHeight-17);
  for(let s=0;s<4;s++){
   if(filter!==-1 && filter!==w) continue;
   const val=volume(s,w), h=(val/maxVal)*plotH;
   const x=gx+groupW/2+(s-1.5)*(barW+gap)-barW/2;
   const y=top+plotH-h;
   ctx.globalAlpha=(selected && selected.s===s && selected.w===w)?1:0.88;
   ctx.fillStyle=COLORS[s];
   roundRect(ctx,x,y,barW,h,5);ctx.fill();
   ctx.globalAlpha=1;
   ctx.fillStyle='#e2e8f0';ctx.font='10px system-ui';ctx.textAlign='center';
   ctx.fillText(String(Math.round(val)),x+barW/2,Math.max(top+10,y-6));
   hitAreas.push({x,y,w:barW,h,s,wk:w});
  }
 }
 // Legend
 let lx=left;
 ctx.font='11px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
 SESSIONS.forEach((s,i)=>{
  ctx.fillStyle=COLORS[i];roundRect(ctx,lx,8,9,9,2);ctx.fill();
  ctx.fillStyle='#cbd5e1';ctx.fillText(s.name,lx+14,13);
  lx+=Math.max(90,ctx.measureText(s.name).width+28);
 });
}
function showDetail(s,w){
 selected={s,w};drawChart();
 const S=SESSIONS[s];
 const rows=S.ex.map(e=>{
  const sets=w===3?2:e[1];
  const reps=w<3?(e[2]*(1+0.1*w)).toFixed(1):e[2];
  const side=e[3]===2?' (×2 bên)':'';
  return `<tr><td>${e[0]}${side}</td><td class="r">${sets} × ${reps}</td></tr>`;
 }).join('');
 const guides=S.ex.map(e=>{
  const g=GUIDES[e[0]];
  if(!g)return '';
  const steps=g.steps.map(x=>`<li>${x}</li>`).join('');
  const q=encodeURIComponent(IMG_Q[e[0]]||e[0]);
  return `<details class="guide"><summary>${e[0]}</summary><div class="guide-body">
   <div><b>Tư thế:</b> ${g.set}</div><ol>${steps}</ol>
   <div class="warning">⚠ ${g.mistake}</div>
   <a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener noreferrer">🔍 Xem hình minh họa</a>
  </div></details>`;
 }).join('');
 detail.innerHTML=`<div class="detail-head" style="color:${COLORS[s]}">${S.name} — ${WEEKS[w]}</div>
 <div class="total">Tổng khối lượng: ${Math.round(volume(s,w))}</div>
 <table>${rows}</table><h3 style="font-size:15px;margin:16px 0 4px">Hướng dẫn kỹ thuật</h3>${guides}`;
}
function chooseAt(clientX,clientY){
 const r=canvas.getBoundingClientRect();
 const x=clientX-r.left,y=clientY-r.top;
 const hit=hitAreas.find(a=>x>=a.x-5&&x<=a.x+a.w+5&&y>=a.y-4&&y<=a.y+a.h+4);
 if(hit)showDetail(hit.s,hit.w);
}
canvas.addEventListener('click',e=>chooseAt(e.clientX,e.clientY));
canvas.addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(hitAreas.length)showDetail(hitAreas[0].s,hitAreas[0].wk);}
});
['Tất cả',...WEEKS].forEach((label,i)=>{
 const b=document.createElement('button');b.type='button';b.textContent=label;
 if(i===0)b.classList.add('on');
 b.addEventListener('click',()=>{
  filter=i-1;
  [...weekBox.children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on');selected=null;drawChart();
 });
 weekBox.appendChild(b);
});
document.getElementById('reset').addEventListener('click',()=>{
 filter=-1;selected=null;
 [...weekBox.children].forEach((x,i)=>x.classList.toggle('on',i===0));
 detail.textContent='Chọn một cột trong biểu đồ để xem chi tiết.';
 drawChart();
});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(setupCanvas,100);});
if(ctx){setupCanvas();}else{detail.textContent='Trình duyệt không hỗ trợ Canvas 2D.';}
</script>
</body>
</html>
