<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhịp 3D · Âm nhạc trực quan với three.js</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#05060f; --panel:rgba(15,20,40,.7); --line:rgba(255,255,255,.08); --text:#e8eaf2; --muted:#8b93a7; --gold:#fbbf24; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(900px 600px at 50% -10%, #1e1b4b 0%, transparent 60%), var(--bg);
    color: var(--text); min-height: 100vh; padding: 20px 14px 40px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 16px; }
  h1 { font-size: 1.9rem; letter-spacing: 1px; }
  h1 span { color: var(--gold); }
  header p { color: var(--muted); font-size: .92rem; margin-top: 4px; }

  #stage {
    width: 100%; height: 460px; border-radius: 16px; overflow: hidden; position: relative;
    border: 1px solid var(--line); background: #05060f; cursor: grab; touch-action: none;
    box-shadow: 0 20px 50px -10px rgba(0,0,0,.6);
  }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .stage-hint { position: absolute; left: 14px; bottom: 10px; font-size: .75rem; color: #64748b; pointer-events: none; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; backdrop-filter: blur(6px); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  label.lab { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .val { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; min-width: 3.2em; }

  button {
    font: inherit; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer;
    transition: transform .12s, filter .12s, background .2s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(1px); }
  .btn-play { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111; min-width: 150px; font-size: 1rem; }
  .btn-ghost { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--text); }
  select { background: rgba(10,14,30,.9); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=range] { accent-color: var(--gold); }

  .seq { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; overflow-x: auto; }
  .lane { display: flex; align-items: center; gap: 4px; min-width: 620px; }
  .lane .lbl { width: 70px; font-size: .8rem; font-weight: 700; flex-shrink: 0; }
  .st {
    flex: 1; height: 30px; border-radius: 7px; background: rgba(255,255,255,.04); border: 1px solid var(--line);
    padding: 0; transition: background .1s, box-shadow .1s;
  }
  .st.beat { border-color: rgba(255,255,255,.18); }
  .st.on { background: var(--c); box-shadow: 0 0 10px var(--c); border-color: transparent; }
  .st.cur { outline: 2px solid #fff; outline-offset: -2px; }
  .st.on.cur { filter: brightness(1.4); }
  .tips { color: var(--muted); font-size: .8rem; margin-top: 10px; line-height: 1.55; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
</style>
<script src="three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r79/three.min.js"><\/script>');
  }
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Nhịp <span>3D</span></h1>
    <p>Âm thanh tổng hợp trực tiếp trên trình duyệt · cảnh 3D phản ứng theo từng nhịp</p>
  </header>

  <div id="stage">
    <div class="stage-hint">Kéo chuột để xoay · Space: Phát / Dừng</div>
  </div>

  <section class="panel">
    <div class="row">
      <button type="button" class="btn-play" id="btnPlay">▶ Phát</button>
      <label class="lab">Tempo <input type="range" id="bpm" min="70" max="180" value="120"> <span class="val" id="bpmVal">120</span></label>
      <label class="lab">Âm lượng <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" style="width:110px"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="lab">Mẫu nhịp
        <select id="preset">
          <option value="house">House 4 sàn</option>
          <option value="breakbeat">Breakbeat</option>
          <option value="random">Ngẫu nhiên</option>
          <option value="clear">Trống</option>
        </select>
      </label>
      <button type="button" class="btn-ghost" id="btnApply">Áp dụng</button>
      <div class="grow"></div>
      <div class="legend">
        <span><i style="background:#ef4444"></i>Kick</span>
        <span><i style="background:#38bdf8"></i>Snare</span>
        <span><i style="background:#facc15"></i>Hi-hat</span>
        <span><i style="background:#22c55e"></i>Bass</span>
        <span><i style="background:#a855f7"></i>Hợp âm</span>
      </div>
    </div>

    <div class="seq" id="seq"></div>
    <div class="tips">Bấm vào từng ô để bật/tắt nốt. Cột sáng là bước đang phát. Mỗi cột trong vòng 3D tương ứng với một bước.</div>
  </section>
</div>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const STEPS = 16;
  const LANES = [
    { key: 'kick',  label: 'Kick',    color: '#ef4444' },
    { key: 'snare', label: 'Snare',   color: '#38bdf8' },
    { key: 'hat',   label: 'Hi-hat',  color: '#facc15' },
    { key: 'bass',  label: 'Bass',    color: '#22c55e' },
  ];
  const COLOR = { kick: '#ef4444', snare: '#38bdf8', hat: '#facc15', bass: '#22c55e', chord: '#a855f7' };
  const STRENGTH = { kick: 1.0, snare: 0.85, hat: 0.4, bass: 0.6 };
  const BASS_NOTES = [45, 0, 45, 48, 0, 45, 52, 0, 43, 0, 43, 47, 0, 43, 50, 0];   // MIDI, Am
  const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];           // Am, F, C, G
  const PRESETS = {
    house:     { kick: i => i % 4 === 0, snare: i => i === 4 || i === 12, hat: i => i % 2 === 1, bass: i => [0, 2, 6, 8, 10, 14].includes(i) },
    breakbeat: { kick: i => [0, 3, 10, 11].includes(i), snare: i => [4, 12, 15].includes(i), hat: i => i % 2 === 0, bass: i => [0, 5, 8, 13].includes(i) },
  };
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

  function makePattern(fn) {
    const p = {};
    LANES.forEach(l => {
      p[l.key] = [];
      for (let i = 0; i < STEPS; i++) p[l.key][i] = fn ? (fn[l.key](i) ? 1 : 0) : 0;
    });
    return p;
  }
  let pattern = makePattern(PRESETS.house);

  // ---------- Âm thanh (Web Audio, tổng hợp) ----------
  let ctx = null, master = null, noiseBuf = null;
  function initAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = Number($('vol').value);
    master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function noiseSrc(t, dur) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.start(t, Math.random() * 0.5, dur);
    return s;
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.5);
  }
  function snare(t) {
    const n = noiseSrc(t, 0.2), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1800;
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    n.connect(bp).connect(g).connect(master);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = 190;
    og.gain.setValueAtTime(0.3, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.connect(og).connect(master);
    o.start(t); o.stop(t + 0.12);
  }
  function hat(t) {
    const n = noiseSrc(t, 0.06), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    n.connect(hp).connect(g).connect(master);
  }
  function bass(t, midi, dur) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = midiHz(midi);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(200, t + 0.2);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f).connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function pad(t, midis, dur) {
    midis.forEach(m => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = midiHz(m);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }

  // ---------- Bộ lập lịch (lookahead) ----------
  let playing = false, step = 0, bar = 0, nextTime = 0, timer = null;
  const events = [];   // sự kiện hình ảnh, đồng bộ theo thời gian âm thanh
  const LOOK = 0.12, TICK = 25;
  const stepDur = () => 60 / Number($('bpm').value) / 4;

  function scheduleStep(s, t) {
    const p = pattern;
    if (s === 0) pad(t, CHORDS[bar % CHORDS.length], stepDur() * 16);
    if (p.kick[s])  { kick(t);  events.push({ t, type: 'kick',  s }); }
    if (p.snare[s]) { snare(t); events.push({ t, type: 'snare', s }); }
    if (p.hat[s])   { hat(t);   events.push({ t, type: 'hat',   s }); }
    if (p.bass[s])  { bass(t, BASS_NOTES[s] || 45, stepDur() * 2); events.push({ t, type: 'bass', s }); }
    if (s === 0) events.push({ t, type: 'chord', s });
  }

  function tick() {
    while (nextTime < ctx.currentTime + LOOK) {
      scheduleStep(step, nextTime);
      events.push({ t: nextTime, type: 'step', s: step });
      nextTime += stepDur();
      step = (step + 1) % STEPS;
      if (step === 0) bar++;
    }
  }

  function startPlay() {
    initAudio();
    ctx.resume();
    step = 0; bar = 0;
    nextTime = ctx.currentTime + 0.08;
    playing = true;
    timer = setInterval(tick, TICK);
    $('btnPlay').textContent = '⏸ Dừng';
  }
  function stopPlay() {
    playing = false;
    clearInterval(timer); timer = null;
    events.length = 0;
    $('btnPlay').textContent = '▶ Phát';
    setCurrent(-1);
  }

  // ---------- Giao diện nhịp ----------
  function buildSeq() {
    const box = $('seq');
    box.innerHTML = '';
    LANES.forEach(l => {
      const row = document.createElement('div');
      row.className = 'lane';
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.style.color = l.color;
      lbl.textContent = l.label;
      row.appendChild(lbl);
      for (let i = 0; i < STEPS; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'st' + (i % 4 === 0 ? ' beat' : '') + (pattern[l.key][i] ? ' on' : '');
        b.style.setProperty('--c', l.color);
        b.dataset.i = i;
        b.addEventListener('click', () => {
          pattern[l.key][i] ^= 1;
          b.classList.toggle('on', !!pattern[l.key][i]);
        });
        row.appendChild(b);
      }
      box.appendChild(row);
    });
  }

  function setCurrent(s) {
    document.querySelectorAll('.st.cur').forEach(el => el.classList.remove('cur'));
    if (s < 0) return;
    document.querySelectorAll('.st[data-i="' + s + '"]').forEach(el => el.classList.add('cur'));
  }

  function applyPreset(name) {
    if (name === 'random') {
      pattern = makePattern({
        kick: i => i === 0 || Math.random() < 0.2,
        snare: () => Math.random() < 0.12,
        hat: () => Math.random() < 0.5,
        bass: () => Math.random() < 0.3,
      });
    } else if (name === 'clear') {
      pattern = makePattern(null);
    } else {
      pattern = makePattern(PRESETS[name]);
    }
    buildSeq();
  }

  // ---------- Cảnh 3D (three.js) ----------
  const stage = $('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    stage.textContent = 'Trình duyệt không hỗ trợ WebGL.';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x05060f, 1);
  stage.insertBefore(renderer.domElement, stage.firstChild);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05060f, 0.035);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.set(0, 5, 18);
  camera.lookAt(0, 0, 0);

  const rig = new THREE.Group();
  scene.add(rig);

  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.7);
  keyLight.position.set(5, 12, 8);
  scene.add(keyLight);
  const colorLights = [
    new THREE.PointLight(0xef4444, 1.2, 40),
    new THREE.PointLight(0x38bdf8, 1.0, 40),
    new THREE.PointLight(0xa855f7, 0.9, 40),
  ];
  colorLights[0].position.set(-8, 4, 4);
  colorLights[1].position.set(8, 4, -4);
  colorLights[2].position.set(0, 8, 0);
  colorLights.forEach(l => scene.add(l));

  // 16 cột xung quanh, mỗi cột ứng với một bước
  const PILLAR_R = 6;
  const pillarGeo = new THREE.BoxGeometry(0.55, 1, 0.55);
  const pillars = [];
  for (let i = 0; i < STEPS; i++) {
    const a = i / STEPS * Math.PI * 2;
    const mat = new THREE.MeshStandardMaterial({ color: 0x334155, emissive: 0x000000, roughness: 0.4, metalness: 0.2 });
    const mesh = new THREE.Mesh(pillarGeo, mat);
    mesh.position.set(Math.cos(a) * PILLAR_R, 0.25, Math.sin(a) * PILLAR_R);
    mesh.scale.y = 0.25;
    rig.add(mesh);
    pillars.push({ mesh, mat, level: 0, angle: a });
  }

  // Điểm đánh dấu bước đang phát
  const markerMesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  rig.add(markerMesh);

  // Lưới sóng dưới sàn
  const gridGeo = new THREE.SphereGeometry(0.09, 8, 6);
  const gridMat = new THREE.MeshStandardMaterial({ color: 0x475569, emissive: 0x111827, roughness: 0.5 });
  const grid = [];
  for (let ix = -5; ix <= 5; ix++) for (let iz = -5; iz <= 5; iz++) {
    const m = new THREE.Mesh(gridGeo, gridMat);
    m.position.set(ix * 1.1, -2.6, iz * 1.1);
    rig.add(m);
    grid.push({ m, x: ix * 1.1, z: iz * 1.1, d: Math.hypot(ix, iz) * 1.1 });
  }

  // Nhân trung tâm: khối wireframe và lõi sáng
  const coreMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0c4a6e, wireframe: true, roughness: 0.3 });
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 1), coreMat);
  core.position.set(0, 0.8, 0);
  rig.add(core);
  const innerMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0ea5e9, roughness: 0.2 });
  const inner = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 18), innerMat);
  inner.position.copy(core.position);
  rig.add(inner);

  // Hạt bắn ra khi có kick
  const P_COUNT = 260;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(P_COUNT * 3);
  const pVel = new Float32Array(P_COUNT * 3);
  const pLife = new Float32Array(P_COUNT);
  for (let i = 0; i < P_COUNT; i++) pPos[i * 3 + 1] = -100;
  pGeo.addAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const pMat = new THREE.PointsMaterial({ size: 0.16, color: 0xfbbf24, transparent: true, opacity: 0.95,
    depthWrite: false, blending: THREE.AdditiveBlending });
  const points = new THREE.Points(pGeo, pMat);
  rig.add(points);
  let pCursor = 0;

  function spawnBurst(n, color) {
    pMat.color.set(color);
    for (let k = 0; k < n; k++) {
      const i = pCursor; pCursor = (pCursor + 1) % P_COUNT;
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      const r = Math.sqrt(1 - u * u);
      const sp = 2 + Math.random() * 4;
      pPos[i * 3] = 0; pPos[i * 3 + 1] = 0.8; pPos[i * 3 + 2] = 0;
      pVel[i * 3] = Math.cos(th) * r * sp;
      pVel[i * 3 + 1] = u * sp;
      pVel[i * 3 + 2] = Math.sin(th) * r * sp;
      pLife[i] = 1;
    }
  }

  function updateParticles(dt) {
    for (let i = 0; i < P_COUNT; i++) {
      if (pLife[i] > 0) {
        pLife[i] -= dt * 1.2;
        const damp = Math.exp(-dt * 1.8);
        pVel[i * 3] *= damp; pVel[i * 3 + 1] *= damp; pVel[i * 3 + 2] *= damp;
        pPos[i * 3] += pVel[i * 3] * dt;
        pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
        pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
        if (pLife[i] <= 0) pPos[i * 3 + 1] = -100;
      }
    }
    pGeo.attributes.position.needsUpdate = true;
  }

  // Trạng thái hình ảnh
  let kickEnv = 0, rippleT = 10, rippleAmp = 0, curStep = -1, flash = 0, yaw = 0, tilt = 0;
  let dragging = false, lastX = 0, lastY = 0;

  function hitPillar(s, strength, key) {
    const p = pillars[s];
    p.level = Math.max(p.level, strength);
    p.mat.color.set(COLOR[key]);
  }

  function onEvent(ev) {
    switch (ev.type) {
      case 'step':
        curStep = ev.s;
        setCurrent(ev.s);
        pillars[ev.s].level = Math.max(pillars[ev.s].level, 0.18);
        break;
      case 'kick':
        kickEnv = 1; rippleT = 0; rippleAmp = 1;
        spawnBurst(45, COLOR.kick);
        hitPillar(ev.s, STRENGTH.kick, 'kick');
        break;
      case 'snare':
        hitPillar(ev.s, STRENGTH.snare, 'snare');
        spawnBurst(18, COLOR.snare);
        break;
      case 'hat':
        hitPillar(ev.s, STRENGTH.hat, 'hat');
        break;
      case 'bass':
        hitPillar(ev.s, STRENGTH.bass, 'bass');
        break;
      case 'chord':
        flash = 1;
        break;
    }
  }

  function resize() {
    const w = stage.clientWidth || 600, h = stage.clientHeight || 460;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.domElement.style.width = w + 'px';
    renderer.domElement.style.height = h + 'px';
  }
  window.addEventListener('resize', resize);

  stage.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw += (e.clientX - lastX) * 0.005;
    tilt = Math.max(-0.5, Math.min(0.5, tilt + (e.clientY - lastY) * 0.003));
    lastX = e.clientX; lastY = e.clientY;
  });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // Phát sự kiện đúng lúc âm thanh được phát
    if (playing && ctx) {
      const t = ctx.currentTime;
      while (events.length && events[0].t <= t) onEvent(events.shift());
    }

    // Cột: tăng/giảm chiều cao theo mức xung
    pillars.forEach(p => {
      p.level *= Math.exp(-dt * 5);
      const target = 0.25 + p.level * 3.2;
      p.mesh.scale.y += (target - p.mesh.scale.y) * Math.min(1, dt * 18);
      p.mesh.position.y = p.mesh.scale.y / 2;
      p.mat.emissive.set(0x000000);
      p.mat.emissive.copy(p.mat.color).multiplyScalar(p.level * 0.7);
    });

    // Điểm đánh dấu bước đang phát
    if (curStep >= 0) {
      const p = pillars[curStep];
      markerMesh.position.set(Math.cos(p.angle) * (PILLAR_R + 1.3), 0.4 + Math.sin(now * 0.01) * 0.1, Math.sin(p.angle) * (PILLAR_R + 1.3));
    }
    markerMesh.material.color.set(curStep >= 0 ? COLOR.kick : 0x64748b);

    // Lưới sóng
    kickEnv *= Math.exp(-dt * 7);
    rippleT += dt;
    rippleAmp = Math.exp(-rippleT * 2.5);
    grid.forEach(g => {
      g.m.position.y = -2.6 + rippleAmp * 0.7 * Math.cos(g.d * 1.6 - rippleT * 10) * Math.exp(-g.d * 0.15);
    });

    // Nhân trung tâm
    const pulse = 1 + kickEnv * 0.6 + 0.03 * Math.sin(now * 0.004);
    core.scale.setScalar(pulse);
    inner.scale.setScalar(0.9 + kickEnv * 0.9);
    core.rotation.y += dt * 0.5;
    core.rotation.x += dt * 0.25;
    flash *= Math.exp(-dt * 3);
    const base = new THREE.Color(0x38bdf8), chord = new THREE.Color(COLOR.chord);
    coreMat.color.copy(base).lerp(chord, flash);
    coreMat.emissive.copy(coreMat.color).multiplyScalar(0.25 + kickEnv * 0.5);
    innerMat.color.copy(coreMat.color);
    innerMat.emissive.copy(coreMat.color).multiplyScalar(0.3 + kickEnv * 0.8);

    // Ánh sáng màu nhấp theo nhịp
    colorLights.forEach((l, i) => { l.intensity = (i === 0 ? 1.2 : i === 1 ? 1 : 0.9) * (0.7 + kickEnv * 0.8); });

    // Xoay cảnh
    if (!dragging) yaw += dt * 0.12;
    rig.rotation.y = yaw;
    rig.rotation.x = tilt;

    updateParticles(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- Điều khiển ----------
  $('btnPlay').addEventListener('click', () => { playing ? stopPlay() : startPlay(); });
  $('bpm').addEventListener('input', () => { $('bpmVal').textContent = $('bpm').value; });
  $('vol').addEventListener('input', () => { if (master) master.gain.value = Number($('vol').value); });
  $('btnApply').addEventListener('click', () => applyPreset($('preset').value));
  $('preset').addEventListener('change', () => applyPreset($('preset').value));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
      e.preventDefault();
      playing ? stopPlay() : startPlay();
    }
  });

  // ---------- Khởi tạo ----------
  $('bpmVal').textContent = $('bpm').value;
  buildSeq();
  resize();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
